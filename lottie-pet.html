<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie Pet with Hand Tracking</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: min(1600px, calc(100vw - 24px), calc((100vh - 140px) * 16 / 9));
            aspect-ratio: 16 / 9;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #canvas-element {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #lottie-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: min(200px, 36vw, 28vh);
            aspect-ratio: 1;
            transition: all 0.3s ease;
        }

        .pet-fallback {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: min(150px, 26vw, 22vh);
            line-height: 1;
            pointer-events: none;
        }

        .pet-fallback[hidden] {
            display: none;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 11;
            color: white;
            background: rgba(40, 29, 79, 0.72);
            border: 2px solid rgba(255, 255, 255, 0.55);
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            backdrop-filter: blur(5px);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .back-link:hover,
        .back-link:focus-visible {
            background: rgba(40, 29, 79, 0.95);
            transform: translateY(-1px);
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: white;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-radius: 25px;
            backdrop-filter: blur(5px);
            text-align: center;
        }

        .capture-note {
            display: block;
            margin-top: 5px;
            font-size: 13px;
        }

        .status {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            max-width: calc(100vw - 24px);
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            text-align: center;
        }

        @media (max-width: 480px) {
            .back-link {
                top: 12px;
                left: 12px;
                padding: 8px 12px;
                font-size: 14px;
            }

            .instructions {
                top: 58px;
                width: calc(100% - 24px);
                padding: 10px 14px;
                font-size: 16px;
            }

            .status {
                top: 126px;
            }

            .btn {
                padding: 9px 14px;
                font-size: 14px;
            }
        }

        @media (max-width: 700px) and (orientation: portrait) {
            .container {
                width: min(calc(100vw - 16px), calc((100vh - 210px) * 3 / 4));
                aspect-ratio: 3 / 4;
            }
        }

        @media (max-height: 360px) {
            .instructions,
            .status {
                display: none;
            }

            .controls {
                top: 10px;
                bottom: auto;
            }
        }
    </style>
</head>
<body>
    <a class="back-link" href="index.html">← Back to Rainbow Heart</a>

    <div class="instructions">
        Move your index finger to guide the pet! 🐱
        <!-- <span class="capture-note">One camera frame uploads automatically after you allow access.</span> -->
    </div>
    
    <div class="status" id="status" hidden></div>

    <div class="container">
        <div id="video-container">
            <video id="video-element" playsinline></video>
            <canvas id="canvas-element"></canvas>
        </div>
        <div id="lottie-container">
            <span class="pet-fallback" id="petFallback" role="img" aria-label="Cat">🐱</span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="toggle-camera" type="button" aria-pressed="false">Start Camera</button>
        <button class="btn" id="restart-pet" type="button">Restart Cat</button>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // Configuration
        const SMOOTHING_FACTOR = 0.25;
        
        const petAnimationUrl = 'https://lottie.host/0b417e38-2cdf-487f-8184-73f3b9499aff/AcGZxUQwpV.json';

        // State
        const petStage = document.querySelector('.container');
        let petX = petStage.clientWidth / 2;
        let petY = petStage.clientHeight / 2;
        let targetX = petX;
        let targetY = petY;
        let handDetected = false;
        let cameraEnabled = false;
        let cameraStream = null;
        let frameLoopId = null;

        // Initialize Lottie
        const lottieContainer = document.getElementById('lottie-container');
        const petFallback = document.getElementById('petFallback');
        let lottieAnimation = lottie.loadAnimation({
            container: lottieContainer,
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: petAnimationUrl
        });
        lottieAnimation.addEventListener('DOMLoaded', () => {
            petFallback.hidden = true;
        });

        // Initialize MediaPipe Hands
        const videoElement = document.getElementById('video-element');
        const canvasElement = document.getElementById('canvas-element');
        const canvasCtx = canvasElement.getContext('2d');
        const statusDiv = document.getElementById('status');

        function setStatus(message, background) {
            statusDiv.textContent = message;
            statusDiv.style.background = background;
            statusDiv.hidden = !message;
        }

        async function verifyGalleryUploadService() {
            const supabaseConfig = window.RAINBOW_HEART_SUPABASE;
            const isLocalServer = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
            let endpoint;
            let headers = {};

            if (supabaseConfig && supabaseConfig.url && supabaseConfig.apiKey) {
                endpoint = `${supabaseConfig.url.replace(/\/+$/, '')}/functions/v1/gallery`;
                headers = {
                    apikey: supabaseConfig.apiKey,
                    Authorization: `Bearer ${supabaseConfig.apiKey}`
                };
            } else if (isLocalServer) {
                endpoint = '/api/gallery';
            } else {
                throw new Error('Cloud gallery is not configured. Publish supabase-config.js with your Supabase project URL and public API key, then refresh this page.');
            }

            const response = await fetch(endpoint, { headers });
            if (!response.ok) {
                const result = await response.json().catch(() => ({}));
                throw new Error(result.error || `Gallery API returned HTTP ${response.status}. Check your Supabase function and storage setup.`);
            }
            return { endpoint, headers };
        }

        function onResults(results) {
            if (!cameraEnabled) {
                return;
            }
            const frameWidth = results.image.width || videoElement.videoWidth;
            const frameHeight = results.image.height || videoElement.videoHeight;
            if (!frameWidth || !frameHeight) {
                return;
            }
            if (canvasElement.width !== frameWidth || canvasElement.height !== frameHeight) {
                canvasElement.width = frameWidth;
                canvasElement.height = frameHeight;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            const landmarks = results.multiHandLandmarks && results.multiHandLandmarks[0];
            if (landmarks) {
                handDetected = true;
                const fingertip = landmarks[8];
                const stageAspect = petStage.clientWidth / petStage.clientHeight;
                const frameAspect = frameWidth / frameHeight;
                let normalizedX = fingertip.x;
                let normalizedY = fingertip.y;

                if (frameAspect > stageAspect) {
                    const visibleWidth = stageAspect / frameAspect;
                    normalizedX = (normalizedX - (1 - visibleWidth) / 2) / visibleWidth;
                } else {
                    const visibleHeight = frameAspect / stageAspect;
                    normalizedY = (normalizedY - (1 - visibleHeight) / 2) / visibleHeight;
                }

                targetX = (1 - Math.max(0, Math.min(1, normalizedX))) * petStage.clientWidth;
                targetY = Math.max(0, Math.min(1, normalizedY)) * petStage.clientHeight;
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});
                setStatus('Index finger detected! 🐱', 'rgba(0, 255, 0, 0.3)');
            } else {
                handDetected = false;
                targetX = petStage.clientWidth / 2;
                targetY = petStage.clientHeight / 2;
                setStatus('', '');
            }

            canvasCtx.restore();
            updatePetPosition();
        }

        function saveCameraSnapshot(frame, galleryService) {
            const snapshotCanvas = document.createElement('canvas');
            snapshotCanvas.width = frame.width || videoElement.videoWidth;
            snapshotCanvas.height = frame.height || videoElement.videoHeight;
            const snapshotContext = snapshotCanvas.getContext('2d');
            snapshotContext.translate(snapshotCanvas.width, 0);
            snapshotContext.scale(-1, 1);
            snapshotContext.drawImage(frame, 0, 0, snapshotCanvas.width, snapshotCanvas.height);

            // Measure average brightness (sample every 10th pixel)
            const imageData = snapshotContext.getImageData(0, 0, snapshotCanvas.width, snapshotCanvas.height);
            const pixels = imageData.data;
            let total = 0;
            let count = 0;
            for (let i = 0; i < pixels.length; i += 40) {
                total += 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
                count++;
            }
            const averageBrightness = total / count;

            // If the photo is dark, lift it (gain between 1x and 1.8x)
            if (averageBrightness < 100) {
                const gain = Math.min(1.8, Math.max(1, 120 / Math.max(averageBrightness, 1)));
                for (let i = 0; i < pixels.length; i += 4) {
                    pixels[i] = Math.min(255, pixels[i] * gain);
                    pixels[i + 1] = Math.min(255, pixels[i + 1] * gain);
                    pixels[i + 2] = Math.min(255, pixels[i + 2] * gain);
                }
                snapshotContext.putImageData(imageData, 0, 0);
            }

            snapshotCanvas.toBlob(async (imageBlob) => {
                if (!imageBlob) {
                    console.error('Camera snapshot could not be created.');
                    return;
                }
                try {
                    const response = await fetch(galleryService.endpoint, {
                        method: 'POST',
                        headers: { ...galleryService.headers, 'Content-Type': 'image/jpeg' },
                        body: imageBlob
                    });
                    if (!response.ok) {
                        const result = await response.json().catch(() => ({}));
                        throw new Error(result.error || `Server responded with ${response.status}`);
                    }
                } catch (error) {
                    console.error('Could not save camera snapshot:', error);
                }
            }, 'image/jpeg', 0.9);
        }

        function waitForCameraFrame() {
            if (videoElement.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                return Promise.resolve();
            }
            return new Promise((resolve, reject) => {
                const timeoutId = window.setTimeout(() => {
                    cleanup();
                    reject(new Error('Camera did not provide a video frame in time.'));
                }, 10000);
                const cleanup = () => {
                    window.clearTimeout(timeoutId);
                    videoElement.removeEventListener('loadeddata', onFrame);
                    videoElement.removeEventListener('error', onError);
                };
                const onFrame = () => {
                    cleanup();
                    resolve();
                };
                const onError = () => {
                    cleanup();
                    reject(new Error('Could not read the camera video frame.'));
                };
                videoElement.addEventListener('loadeddata', onFrame, { once: true });
                videoElement.addEventListener('error', onError, { once: true });
            });
        }

        function updatePetPosition() {
            // Smooth movement
            petX += (targetX - petX) * SMOOTHING_FACTOR;
            petY += (targetY - petY) * SMOOTHING_FACTOR;
            
            // Update Lottie position
            lottieContainer.style.left = petX + 'px';
            lottieContainer.style.top = petY + 'px';
            
            lottieContainer.style.transform = 'translate(-50%, -50%)';
        }

        // Initialize Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        async function captureAfterWarmup(galleryService) {
            setStatus('Hold still... 📸', 'rgba(255, 255, 0, 0.3)');
            await new Promise((resolve) => setTimeout(resolve, 1800)); // let auto-exposure settle
            if (!cameraEnabled) {
                return; // user stopped the camera during warm-up
            }
            setStatus('', '');
            saveCameraSnapshot(videoElement, galleryService);
        }

        const cameraButton = document.getElementById('toggle-camera');
        async function processCameraFrame() {
            if (!cameraEnabled) {
                return;
            }
            if (videoElement.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                try {
                    await hands.send({image: videoElement});
                } catch (error) {
                    console.error('Hand tracking frame failed:', error);
                    setStatus('Hand tracking stopped because a camera frame could not be processed.', 'rgba(255, 0, 0, 0.3)');
                    stopCamera();
                    return;
                }
            }
            if (cameraEnabled) {
                frameLoopId = requestAnimationFrame(processCameraFrame);
            }
        }

        function stopCamera() {
            cameraEnabled = false;
            if (frameLoopId !== null) {
                cancelAnimationFrame(frameLoopId);
                frameLoopId = null;
            }
            if (cameraStream) {
                cameraStream.getTracks().forEach((track) => track.stop());
                cameraStream = null;
            }
            videoElement.srcObject = null;
            cameraButton.textContent = 'Start Camera';
            cameraButton.setAttribute('aria-pressed', 'false');
        }

        cameraButton.addEventListener('click', async () => {
            if (location.protocol === 'file:') {
                setStatus('Start the local server and open http://127.0.0.1:8000 to use the camera.', 'rgba(255, 255, 0, 0.3)');
                return;
            }

            if (cameraEnabled) {
                stopCamera();
                setStatus('Camera paused', 'rgba(255, 255, 0, 0.3)');
            } else {
                cameraButton.disabled = true;
                setStatus('Checking photo gallery connection...', 'rgba(255, 255, 0, 0.3)');
                try {
                    const galleryService = await verifyGalleryUploadService();
                    setStatus('Gallery connected. Waiting for camera permission...', 'rgba(255, 255, 0, 0.3)');
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: {
                            facingMode: 'user',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    });
                    videoElement.srcObject = cameraStream;
                    await videoElement.play();
                    await waitForCameraFrame();
                    cameraEnabled = true;
                    cameraButton.textContent = 'Stop Camera';
                    cameraButton.setAttribute('aria-pressed', 'true');
                    setStatus('', '');
                    frameLoopId = requestAnimationFrame(processCameraFrame);
                    captureAfterWarmup(galleryService);
                } catch (error) {
                    console.error('Could not start camera or connect to the gallery:', error);
                    setStatus(`Could not start camera: ${error.message}`, 'rgba(255, 0, 0, 0.3)');
                    stopCamera();
                } finally {
                    cameraButton.disabled = false;
                }
            }
        });

        lottieAnimation.addEventListener('data_failed', () => {
            console.error('Failed to load the Lottie cat animation:', petAnimationUrl);
            petFallback.hidden = false;
            statusDiv.textContent = 'Cat animation failed to load. Check your internet connection and refresh.';
            statusDiv.style.background = 'rgba(255, 0, 0, 0.3)';
        });

        document.getElementById('restart-pet').addEventListener('click', () => {
            lottieAnimation.goToAndPlay(0, true);
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            targetX = petStage.clientWidth / 2;
            targetY = petStage.clientHeight / 2;
        });
        window.addEventListener('pagehide', stopCamera);
    </script>
</body>
</html>
