<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luvbabeOuksasm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
        }

        svg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .main-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            color: #fff;
            font-size: clamp(24px, 5vw, 48px);
            text-shadow: 
                0 0 10px rgba(255, 105, 180, 0.8),
                0 0 20px rgba(255, 105, 180, 0.6),
                0 0 30px rgba(255, 105, 180, 0.4),
                2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
            padding: 20px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 0.9;
            }
        }

        .days-counter {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            color: #fff;
            font-size: clamp(16px, 3vw, 24px);
            background: rgba(255, 105, 180, 0.2);
            padding: 15px 30px;
            border-radius: 25px;
            border: 2px solid rgba(255, 105, 180, 0.5);
            backdrop-filter: blur(5px);
        }

        .days-counter .number {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
        }

        .sparkle {
            position: fixed;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            animation: sparkle-fade 1s ease-out forwards;
        }

        @keyframes sparkle-fade {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .floating-heart {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 3;
            animation: float-up 3s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-500px) rotate(360deg);
                opacity: 0;
            }
        }

        .mouse-trail {
            position: fixed;
            width: 8px;
            height: 8px;
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            animation: trail-fade 0.8s ease-out forwards;
        }

        @keyframes trail-fade {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .click-instruction {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }

        .control-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-btn {
            background: rgba(255, 105, 180, 0.3);
            border: 2px solid rgba(255, 105, 180, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Georgia', serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover {
            background: rgba(255, 105, 180, 0.5);
            transform: scale(1.05);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .gallery-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 15;
            background: rgba(255, 105, 180, 0.3);
            border: 2px solid rgba(255, 105, 180, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Georgia', serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .gallery-btn:hover {
            background: rgba(255, 105, 180, 0.5);
            transform: scale(1.05);
        }

        .gallery-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .gallery-modal.active {
            display: flex;
        }

        .gallery-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .gallery-image {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 105, 180, 0.5);
            border: none;
            color: white;
            padding: 20px;
            cursor: pointer;
            font-size: 24px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .gallery-nav:hover {
            background: rgba(255, 105, 180, 0.8);
            transform: translateY(-50%) scale(1.1);
        }

        .gallery-prev {
            left: -60px;
        }

        .gallery-next {
            right: -60px;
        }

        .gallery-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255, 0, 0, 0.5);
            border: none;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .gallery-close:hover {
            background: rgba(255, 0, 0, 0.8);
        }

        .gallery-caption {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <svg id="hearts" viewBox="-600 -400 1200 800" preserveAspectRatio="xMidYMid slice">
        <defs>
          <symbol id="heart" viewBox="-69 -16 138 138">
          <path d="M0,12
                   C 50,-30 110,50  0,120
                   C-110,50 -50,-30 0,12z"/>
          </symbol>
      </defs>
      </svg>
      
      <div class="days-counter">
        We've been together for<br>
        <span class="number" id="daysCounter">0</span> days
      </div>
      
      <h2 class="main-text">
        I Love You So Much, Babe Ouksa!!
    </h2>
    
    <p class="click-instruction">Click anywhere to add hearts ✨</p>
    
    <button class="gallery-btn" id="galleryBtn">📸 Gallery</button>
    
    <div class="control-panel">
        <button class="control-btn" id="musicBtn">🎵 Play Music</button>
        <button class="control-btn" id="nextTrackBtn">⏭️ Next Track</button>
    </div>
    
    <div class="gallery-modal" id="galleryModal">
        <div class="gallery-content">
            <button class="gallery-close" id="galleryClose">✕ Close</button>
            <button class="gallery-nav gallery-prev" id="galleryPrev">❮</button>
            <img class="gallery-image" id="galleryImage" src="" alt="Gallery Image">
            <button class="gallery-nav gallery-next" id="galleryNext">❯</button>
            <div class="gallery-caption" id="galleryCaption"></div>
        </div>
    </div>
    
    <audio id="bgMusic" loop></audio>

</body>

<script>
    const colors = ["#e03776","#8f3e98","#4687bf","#3bab6f","#f9c25e","#f47274","#ff6b9d","#c44569","#ff8a5c","#ff3c83"];
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const SVG_XLINK = "http://www.w3.org/1999/xlink";

    let heartsRy = [];

    function useTheHeart(n){
      let use = document.createElementNS(SVG_NS, 'use');
      use.n = n;
      use.setAttributeNS(SVG_XLINK, 'xlink:href', '#heart');
      use.setAttributeNS(null, 'transform', `scale(${use.n})`);
      use.setAttributeNS(null, 'fill', colors[n%colors.length]);
      use.setAttributeNS(null, 'x', -69);
      use.setAttributeNS(null, 'y', -69);
      use.setAttributeNS(null, 'width', 138);
      use.setAttributeNS(null, 'height', 138);
      
      heartsRy.push(use);
      hearts.appendChild(use);
    }

    for(let n = 18; n >= 0; n--){useTheHeart(n)}

    function Frame(){
      window.requestAnimationFrame(Frame);
      for(let i = 0; i < heartsRy.length; i++){
        if(heartsRy[i].n < 18){
            heartsRy[i].n +=.01;
        }else{
            heartsRy[i].n = 0;
            hearts.appendChild(heartsRy[i]);
        }
        heartsRy[i].setAttributeNS(null, 'transform', `scale(${heartsRy[i].n})`);
      }
    }

    Frame();

    // Days counter (set your relationship start date here)
    const startDate = new Date('2022-10-09'); // CHANGE THIS DATE!
    function updateDaysCounter() {
        const now = new Date();
        const diff = now - startDate;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById('daysCounter').textContent = days;
    }
    updateDaysCounter();
    setInterval(updateDaysCounter, 1000);

    // Add sparkle effect
    function createSparkle(x, y) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = x + 'px';
        sparkle.style.top = y + 'px';
        sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
        document.body.appendChild(sparkle);
        
        setTimeout(() => {
            sparkle.remove();
        }, 1000);
    }

    // Add floating heart on click
    function createFloatingHeart(x, y) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.innerHTML = '❤️';
        heart.style.left = x + 'px';
        heart.style.top = y + 'px';
        heart.style.color = colors[Math.floor(Math.random() * colors.length)];
        heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
        document.body.appendChild(heart);
        
        setTimeout(() => {
            heart.remove();
        }, 3000);
    }

    // Mouse trail effect
    let trailTimeout;
    document.addEventListener('mousemove', (e) => {
        clearTimeout(trailTimeout);
        trailTimeout = setTimeout(() => {
            const trail = document.createElement('div');
            trail.className = 'mouse-trail';
            trail.style.left = e.clientX + 'px';
            trail.style.top = e.clientY + 'px';
            document.body.appendChild(trail);
            
            setTimeout(() => {
                trail.remove();
            }, 800);
        }, 50);
    });

    // Click to add hearts and sparkles
    document.addEventListener('click', (e) => {
        // Create multiple sparkles
        for(let i = 0; i < 5; i++) {
            setTimeout(() => {
                const offsetX = (Math.random() - 0.5) * 50;
                const offsetY = (Math.random() - 0.5) * 50;
                createSparkle(e.clientX + offsetX, e.clientY + offsetY);
            }, i * 50);
        }
        
        // Create floating heart
        createFloatingHeart(e.clientX, e.clientY);
    });

    // Random sparkles in background
    setInterval(() => {
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        createSparkle(x, y);
    }, 300);

    // Music playlist
    const musicTracks = [
        { name: "Romantic Piano", url: "https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3?filename=romantic-piano-164822.mp3" },
        { name: "Love Ballad", url: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-124980.mp3" },
        { name: "Sweet Melody", url: "https://cdn.pixabay.com/download/audio/2022/02/07/audio_8b61449575.mp3?filename=romantic-piano-11166.mp3" }
    ];
    
    let currentTrack = 0;
    const bgMusic = document.getElementById('bgMusic');
    let isPlaying = false;

    function loadTrack(index) {
        bgMusic.src = musicTracks[index].url;
    }

    loadTrack(0);

    // Music control
    document.getElementById('musicBtn').addEventListener('click', () => {
        if (isPlaying) {
            bgMusic.pause();
            document.getElementById('musicBtn').textContent = '🎵 Play Music';
            isPlaying = false;
        } else {
            bgMusic.play();
            document.getElementById('musicBtn').textContent = '⏸️ Pause Music';
            isPlaying = true;
        }
    });

    // Next track
    document.getElementById('nextTrackBtn').addEventListener('click', () => {
        currentTrack = (currentTrack + 1) % musicTracks.length;
        loadTrack(currentTrack);
        if (isPlaying) {
            bgMusic.play();
        }
    });

    // Set music volume
    bgMusic.volume = 0.3;

    // Photo Gallery
    const galleryImages = [
        { src: "https://via.placeholder.com/800x600/ff6b9d/ffffff?text=Photo+1", caption: "Our First Date 💕" },
        { src: "https://via.placeholder.com/800x600/c44569/ffffff?text=Photo+2", caption: "Beautiful Memories 🌟" },
        { src: "https://via.placeholder.com/800x600/ff8a5c/ffffff?text=Photo+3", caption: "Special Moments ✨" },
        { src: "https://via.placeholder.com/800x600/e03776/ffffff?text=Photo+4", caption: "Forever Together 💖" }
    ];

    let currentImageIndex = 0;
    const galleryModal = document.getElementById('galleryModal');
    const galleryImage = document.getElementById('galleryImage');
    const galleryCaption = document.getElementById('galleryCaption');

    document.getElementById('galleryBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        galleryModal.classList.add('active');
        updateGalleryImage();
    });

    document.getElementById('galleryClose').addEventListener('click', (e) => {
        e.stopPropagation();
        galleryModal.classList.remove('active');
    });

    document.getElementById('galleryPrev').addEventListener('click', (e) => {
        e.stopPropagation();
        currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
        updateGalleryImage();
    });

    document.getElementById('galleryNext').addEventListener('click', (e) => {
        e.stopPropagation();
        currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
        updateGalleryImage();
    });

    function updateGalleryImage() {
        galleryImage.src = galleryImages[currentImageIndex].src;
        galleryCaption.textContent = galleryImages[currentImageIndex].caption;
    }

    // Close gallery on modal click
    galleryModal.addEventListener('click', (e) => {
        if (e.target === galleryModal) {
            galleryModal.classList.remove('active');
        }
    });

    // Keyboard navigation for gallery
    document.addEventListener('keydown', (e) => {
        if (galleryModal.classList.contains('active')) {
            if (e.key === 'ArrowLeft') {
                currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
                updateGalleryImage();
            } else if (e.key === 'ArrowRight') {
                currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
                updateGalleryImage();
            } else if (e.key === 'Escape') {
                galleryModal.classList.remove('active');
            }
        }
    });

</script>
</html>
