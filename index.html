<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luvbabeOuksasm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
        }

        svg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .main-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            color: #fff;
            font-size: clamp(24px, 5vw, 48px);
            text-shadow: 
                0 0 10px rgba(255, 105, 180, 0.8),
                0 0 20px rgba(255, 105, 180, 0.6),
                0 0 30px rgba(255, 105, 180, 0.4),
                2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
            padding: 20px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 0.9;
            }
        }

        .days-counter {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            color: #fff;
            font-size: clamp(17px, 3vw, 22px);
            padding: 10px 16px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
        }

        .days-counter-title {
            display: block;
            margin-bottom: 2px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .days-counter .number {
            font-size: clamp(36px, 5vw, 46px);
            font-weight: bold;
            color: #fff;
        }

        .sparkle {
            position: fixed;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            animation: sparkle-fade 1s ease-out forwards;
        }

        @keyframes sparkle-fade {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .floating-heart {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 3;
            animation: float-up 3s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-500px) rotate(360deg);
                opacity: 0;
            }
        }

        .mouse-trail {
            position: fixed;
            width: 8px;
            height: 8px;
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            animation: trail-fade 0.8s ease-out forwards;
        }

        @keyframes trail-fade {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .control-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-btn {
            background: rgba(255, 105, 180, 0.3);
            border: 2px solid rgba(255, 105, 180, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Georgia', serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover {
            background: rgba(255, 105, 180, 0.5);
            transform: scale(1.05);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .music-video-panel {
            display: none;
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            width: min(320px, calc(100vw - 24px));
            padding: 10px;
            color: white;
            text-align: center;
            background: rgba(22, 33, 62, 0.95);
            border: 2px solid rgba(255, 105, 180, 0.6);
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .music-video-panel.active {
            display: block;
        }

        .music-video-title {
            margin-bottom: 8px;
            font-size: 14px;
        }

        #youtubePlayer,
        #youtubePlayer iframe {
            display: block;
            width: 100% !important;
            aspect-ratio: 16 / 9;
        }

        #youtubePlayer iframe {
            height: auto !important;
        }

        .music-video-status {
            margin-top: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        .gallery-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 15;
            background: rgba(255, 105, 180, 0.3);
            border: 2px solid rgba(255, 105, 180, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Georgia', serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .cat-link {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 16;
            width: 48px;
            height: 48px;
            padding: 0;
            display: grid;
            place-items: center;
            font-size: 25px;
            text-decoration: none;
        }

        .gallery-btn:hover {
            background: rgba(255, 105, 180, 0.5);
            transform: scale(1.05);
        }

        .gallery-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .gallery-modal.active {
            display: flex;
        }

        .gallery-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .gallery-image {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 105, 180, 0.5);
            border: none;
            color: white;
            padding: 20px;
            cursor: pointer;
            font-size: 24px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .gallery-nav:hover {
            background: rgba(255, 105, 180, 0.8);
            transform: translateY(-50%) scale(1.1);
        }

        .gallery-prev {
            left: -60px;
        }

        .gallery-next {
            right: -60px;
        }

        .gallery-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255, 0, 0, 0.5);
            border: none;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .gallery-close:hover {
            background: rgba(255, 0, 0, 0.8);
        }

        .gallery-caption {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .days-counter {
                top: 12px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                max-width: calc(100vw - 24px);
                padding: 9px 16px;
                border-radius: 22px;
                font-size: 16px;
            }

            .days-counter .number {
                font-size: clamp(34px, 9vw, 42px);
            }

            .gallery-btn {
                bottom: 12px;
                left: 12px;
                width: 48px;
                height: 48px;
                padding: 0;
                display: grid;
                place-items: center;
                font-size: 24px;
            }

            .gallery-btn .gallery-label {
                display: none;
            }

            .control-panel {
                bottom: 12px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                flex-wrap: nowrap;
                gap: 8px;
            }

            .control-btn {
                padding: 8px 6px;
                font-size: 12px;
                white-space: nowrap;
            }

            .cat-link {
                right: 12px;
                bottom: 12px;
            }

            .gallery-btn {
                left: 12px;
                bottom: 12px;
            }

            .gallery-btn,
            .cat-link {
                flex-shrink: 0;
            }

            .gallery-modal {
                padding: 16px;
            }

            .gallery-content {
                width: 100%;
                max-width: 100%;
                max-height: 100%;
            }

            .gallery-image {
                display: block;
                max-width: 100%;
                max-height: 70vh;
                margin: 0 auto;
            }

            .gallery-close {
                top: 12px;
                right: 12px;
                z-index: 1;
                padding: 10px 14px;
                font-size: 16px;
            }

            .gallery-nav {
                width: 44px;
                height: 44px;
                padding: 0;
                font-size: 20px;
            }

            .gallery-prev {
                left: 8px;
            }

            .gallery-next {
                right: 8px;
            }

            .gallery-caption {
                position: static;
                transform: none;
                margin-top: 12px;
                font-size: 16px;
                white-space: normal;
            }
        }

        @media (max-width: 300px) {
            .control-panel {
                max-width: 150px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<script>
    const colors = ["#e03776","#8f3e98","#4687bf","#3bab6f","#f9c25e","#f47274","#ff6b9d","#c44569","#ff8a5c","#ff3c83"];
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const SVG_XLINK = "http://www.w3.org/1999/xlink";

    let heartsRy = [];

    function useTheHeart(n){
      let use = document.createElementNS(SVG_NS, 'use');
      use.n = n;
      use.setAttributeNS(SVG_XLINK, 'xlink:href', '#heart');
      use.setAttributeNS(null, 'transform', `scale(${use.n})`);
      use.setAttributeNS(null, 'fill', colors[n%colors.length]);
      use.setAttributeNS(null, 'x', -69);
      use.setAttributeNS(null, 'y', -69);
      use.setAttributeNS(null, 'width', 138);
      use.setAttributeNS(null, 'height', 138);
      
      heartsRy.push(use);
      hearts.appendChild(use);
    }

    for(let n = 18; n >= 0; n--){useTheHeart(n)}

    function Frame(){
      window.requestAnimationFrame(Frame);
      for(let i = 0; i < heartsRy.length; i++){
        if(heartsRy[i].n < 18){
            heartsRy[i].n +=.01;
        }else{
            heartsRy[i].n = 0;
            hearts.appendChild(heartsRy[i]);
        }
        heartsRy[i].setAttributeNS(null, 'transform', `scale(${heartsRy[i].n})`);
      }
    }

    Frame();

    // Change this date to update the days-together counter.
    const startDate = new Date(2022, 9, 9);
    function updateDaysCounter() {
        const currentDate = new Date();
        currentDate.setHours(0, 0, 0, 0);
        const days = Math.floor((currentDate - startDate) / (1000 * 60 * 60 * 24));
        document.getElementById('daysCounter').textContent = Number.isFinite(days) && days >= 0 ? days : '—';
    }
    updateDaysCounter();
    setInterval(updateDaysCounter, 60 * 1000);
    /*
    Date picker behavior, saved locally:
    - Restore the date input above.
    - Read/write its YYYY-MM-DD value with localStorage.
    - Recalculate the counter when its value changes.
    */

    // Add sparkle effect
    function createSparkle(x, y) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = x + 'px';
        sparkle.style.top = y + 'px';
        sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
        document.body.appendChild(sparkle);
        
        setTimeout(() => {
            sparkle.remove();
        }, 1000);
    }

    // Add floating heart on click
    function createFloatingHeart(x, y) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.innerHTML = '❤️';
        heart.style.left = x + 'px';
        heart.style.top = y + 'px';
        heart.style.color = colors[Math.floor(Math.random() * colors.length)];
        heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
        document.body.appendChild(heart);
        
        setTimeout(() => {
            heart.remove();
        }, 3000);
    }

    // Mouse trail effect
    let trailTimeout;
    document.addEventListener('mousemove', (e) => {
        clearTimeout(trailTimeout);
        trailTimeout = setTimeout(() => {
            const trail = document.createElement('div');
            trail.className = 'mouse-trail';
            trail.style.left = e.clientX + 'px';
            trail.style.top = e.clientY + 'px';
            document.body.appendChild(trail);
            
            setTimeout(() => {
                trail.remove();
            }, 800);
        }, 50);
    });

    /*
    // Click to add hearts and sparkles
    document.addEventListener('click', (e) => {
        // Create multiple sparkles
        for(let i = 0; i < 5; i++) {
            setTimeout(() => {
                const offsetX = (Math.random() - 0.5) * 50;
                const offsetY = (Math.random() - 0.5) * 50;
                createSparkle(e.clientX + offsetX, e.clientY + offsetY);
            }, i * 50);
        }
        
        // Create floating heart
        createFloatingHeart(e.clientX, e.clientY);
    });
    */

    // Random sparkles in background
    setInterval(() => {
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        createSparkle(x, y);
    }, 300);

    // Music playlist
    const musicTracks = [
        { name: "Romantic Piano", url: "https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3?filename=romantic-piano-164822.mp3" },
        { name: "Love Ballad", url: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-124980.mp3" },
        // { name: "Love Shine — Leeheesang", youtubeId: "P_6VIOKGRgI" },
        // { name: "Sweet Melody", url: "https://cdn.pixabay.com/download/audio/2022/02/07/audio_8b61449575.mp3?filename=romantic-piano-11166.mp3" },
        // { name: "Sweet by Cas", url: "..."}

    ];
    
    let currentTrack = 0;
    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const musicVideoPanel = document.getElementById('musicVideoPanel');
    const youtubeStatus = document.getElementById('youtubeStatus');
    let isPlaying = false;
    let youtubePlayer = null;
    let youtubeApiReady = false;
    let youtubeApiFailed = false;
    let youtubePlayerReady = false;

    function updateMusicButton() {
        musicBtn.textContent = isPlaying ? '⏸️ Pause Music' : '🎵 Play Music';
    }

    function initializeYoutubePlayer() {
        if (!youtubeApiReady || youtubePlayer || !musicVideoPanel.classList.contains('active')) {
            return;
        }

        const youtubeVideoId = musicTracks[currentTrack].youtubeId;
        if (!youtubeVideoId) {
            return;
        }

        const playerVars = {
            controls: 1,
            playsinline: 1
        };
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
            playerVars.origin = window.location.origin;
        }

        youtubePlayer = new YT.Player('youtubePlayer', {
            width: '320',
            height: '180',
            videoId: youtubeVideoId,
            playerVars,
            events: {
                onReady: (event) => {
                    youtubePlayerReady = true;
                    youtubeStatus.textContent = 'Use the video controls or Play Music.';
                    if (musicTracks[currentTrack].youtubeId === youtubeVideoId) {
                        event.target.cueVideoById(youtubeVideoId);
                    } else {
                        event.target.pauseVideo();
                    }
                },
                onStateChange: (event) => {
                    if (!musicTracks[currentTrack].youtubeId) {
                        return;
                    }

                    if (event.data === YT.PlayerState.PLAYING) {
                        isPlaying = true;
                        updateMusicButton();
                    } else if (
                        event.data === YT.PlayerState.PAUSED ||
                        event.data === YT.PlayerState.ENDED
                    ) {
                        isPlaying = false;
                        updateMusicButton();
                    }
                },
                onError: () => {
                    youtubeStatus.textContent = 'This video cannot be played here.';
                }
            }
        });
    }

    window.onYouTubeIframeAPIReady = () => {
        youtubeApiReady = true;
        initializeYoutubePlayer();
    };

    const youtubeApiScript = document.createElement('script');
    youtubeApiScript.src = 'https://www.youtube.com/iframe_api';
    youtubeApiScript.addEventListener('error', () => {
        youtubeApiFailed = true;
        if (musicTracks[currentTrack].youtubeId) {
            youtubeStatus.textContent = 'Could not load YouTube. Check your internet connection.';
        }
    });
    document.head.appendChild(youtubeApiScript);

    function loadTrack(index) {
        const track = musicTracks[index];
        if (track.youtubeId) {
            bgMusic.pause();
            musicVideoPanel.classList.add('active');
            youtubeStatus.textContent = youtubeApiFailed
                ? 'Could not load YouTube. Check your internet connection.'
                : 'Loading YouTube player...';
            initializeYoutubePlayer();
            if (youtubePlayerReady) {
                if (isPlaying) {
                    youtubePlayer.loadVideoById(track.youtubeId);
                } else {
                    youtubePlayer.cueVideoById(track.youtubeId);
                }
            } else {
                isPlaying = false;
                updateMusicButton();
            }
            return;
        }

        musicVideoPanel.classList.remove('active');
        if (youtubePlayerReady) {
            youtubePlayer.pauseVideo();
        }
        bgMusic.src = track.url;
        if (isPlaying) {
            bgMusic.play();
        }
    }

    loadTrack(0);

    // Music control
    musicBtn.addEventListener('click', () => {
        if (musicTracks[currentTrack].youtubeId) {
            if (!youtubePlayerReady) {
                youtubeStatus.textContent = youtubeApiFailed
                    ? 'Could not load YouTube. Check your internet connection.'
                    : 'Player is loading. Please try Play Music again shortly.';
                initializeYoutubePlayer();
                return;
            }

            if (isPlaying) {
                youtubePlayer.pauseVideo();
            } else {
                youtubePlayer.playVideo();
                isPlaying = true;
                updateMusicButton();
            }
            return;
        }

        if (isPlaying) {
            bgMusic.pause();
            isPlaying = false;
        } else {
            bgMusic.play();
            isPlaying = true;
        }
        updateMusicButton();
    });

    // Next track
    document.getElementById('nextTrackBtn').addEventListener('click', () => {
        currentTrack = (currentTrack + 1) % musicTracks.length;
        loadTrack(currentTrack);
    });

    // Set music volume
    bgMusic.volume = 0.3;

    // Photo Gallery
    const galleryImages = [
        { src: "./images/BeautyPlus-photo_booth-2026-05-03T06_39_59.png", caption: "A memory from May 3, 2026 💕" },
        { src: "./images/BeautyPlus-photo_booth-2026-04-25T07_20_13.png", caption: "A memory from April 25, 2026 🌟" },
        { src: "./images/BeautyPlus-photo_booth-2026-04-04T06_15_08.png", caption: "A memory from April 4, 2026 ✨" },
        { src: "./images/BeautyPlus-photo_booth-2026-04-04T06_13_18.png", caption: "A memory from April 4, 2026 💖" },
        { src: "./images/BeautyPlus-photo_booth-2026-04-04T06_09_49.png", caption: "A memory from April 4, 2026 💕" },
        { src: "./images/BeautyPlus-photo_booth-2026-04-04T06_07_26.png", caption: "A memory from April 4, 2026 🌟" },
        { src: "./images/BeautyPlus-photo_booth-2026-04-04T06_02_34.png", caption: "A memory from April 4, 2026 ✨" },
        { src: "./images/BeautyPlus-photo_booth-2026-04-04T06_00_50.png", caption: "A memory from April 4, 2026 💖" },
        { src: "./images/BeautyPlus-photo_booth-2026-04-04T05_56_41.png", caption: "A memory from April 4, 2026 💕" }
    ];

    let currentImageIndex = 0;
    const galleryModal = document.getElementById('galleryModal');
    const galleryImage = document.getElementById('galleryImage');
    const galleryCaption = document.getElementById('galleryCaption');

    document.getElementById('galleryBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        galleryModal.classList.add('active');
        updateGalleryImage();
    });

    document.getElementById('galleryClose').addEventListener('click', (e) => {
        e.stopPropagation();
        galleryModal.classList.remove('active');
    });

    document.getElementById('galleryPrev').addEventListener('click', (e) => {
        e.stopPropagation();
        currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
        updateGalleryImage();
    });

    document.getElementById('galleryNext').addEventListener('click', (e) => {
        e.stopPropagation();
        currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
        updateGalleryImage();
    });

    function updateGalleryImage() {
        galleryImage.src = galleryImages[currentImageIndex].src;
        galleryCaption.textContent = galleryImages[currentImageIndex].caption;
    }

    // Close gallery on modal click
    galleryModal.addEventListener('click', (e) => {
        if (e.target === galleryModal) {
            galleryModal.classList.remove('active');
        }
    });

    // Keyboard navigation for gallery
    document.addEventListener('keydown', (e) => {
        if (galleryModal.classList.contains('active')) {
            if (e.key === 'ArrowLeft') {
                currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
                updateGalleryImage();
            } else if (e.key === 'ArrowRight') {
                currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
                updateGalleryImage();
            } else if (e.key === 'Escape') {
                galleryModal.classList.remove('active');
            }
        }
    });

</script>
</html>
